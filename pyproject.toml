[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "artimeri-pipeline_parallel_bubble_dedup"
version = "0.1.0"
description = "对内容做归一化与分片比对，找出预训练并行策略专家·流水线并行气泡比例上的重复项并按相似度归并"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "artimeri" }]
keywords = ["ai", "llm", "cli", "analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://artimeri.github.io"
Repository = "https://github.com/artimeri/pipeline_parallel_bubble_dedup"
Issues = "https://github.com/artimeri/pipeline_parallel_bubble_dedup/issues"

[project.scripts]
pipeline_parallel_bubble_dedup = "pipeline_parallel_bubble_dedup:main"

[tool.setuptools]
py-modules = ["pipeline_parallel_bubble_dedup"]
